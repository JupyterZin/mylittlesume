[project]
name = "talos"
version = "0.1.0"
description = "Talos — agente pessoal do Lucas, com o Claude (Agent SDK) como cérebro"
requires-python = ">=3.12,<3.13"
dependencies = [
  "claude-agent-sdk==0.2.163",       # fixado: atualizar só junto com o CLI (RUNBOOK)
  "fastapi>=0.142",
  "uvicorn[standard]>=0.54",
  "sqlmodel>=0.0.47",
  "alembic>=1.20",
  "apscheduler>=3.11,<4",
  "python-telegram-bot>=22.8,<23",
  "google-api-python-client>=2.201",
  "google-auth>=2.59",
  "google-auth-oauthlib>=1.5",
  "cryptography>=50",
  "structlog>=26.1",
  "pydantic-settings>=2.15",
  "pyyaml>=6.0.3",
  "httpx>=0.28",
  "holidays>=0.105",
  "python-dateutil>=2.9",
  "typer>=0.27",
]

[project.scripts]
talos = "talos.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "ruff>=0.16",
  "pre-commit>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["talos"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["e2e: consome a assinatura; rodar só com `make e2e`"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "ASYNC109", "ASYNC230", "ASYNC240"]  # stat/open locais e curtos: ruído
